<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recupera tu Contraseña - Entre Líneas</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      background: #fff;
      padding: 8px;
    }
    .card {
      background: linear-gradient(145deg, #1a1a1a, #0f0f0f);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
    }
    h1 {
      color: #fff;
      font-size: 24px;
      margin: 0 0 20px 0;
      font-weight: 400;
    }
    p {
      color: #a3a3a3;
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 30px 0;
    }
    /* Botón estilo Crimson Night - Blanco y Negro */
    .button {
      display: inline-block;
      background-color: #ffffff;
      color: #0a0a0a;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }
    .button:hover {
      background-color: #f5f5f5;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.15);
    }
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #525252;
      font-size: 13px;
    }
    .note {
      margin-top: 30px;
      font-size: 13px;
      color: #525252;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo">
        <img src="https://entre-lineas-rap.vercel.app/1-01.png" alt="Entre Líneas">
      </div>
      <h1>Recupera tu Contraseña</h1>
      <p>Hemos recibido una solicitud para restablecer tu contraseña del Panel de Control de Entre Líneas.</p>
      <p>Haz clic en el botón de abajo para crear una nueva contraseña:</p>
<a href="{{ .SiteURL }}/auth/v1/verify?token_hash={{ .TokenHash }}&type=email&next=/admin/reset-password" class="button">Crear Nueva Contraseña</a>
      <p class="note">Este link expira en 60 minutos.</p>
    </div>
    <div class="footer">
      <p>© 2026 Entre Líneas - Colombia</p>
    </div>
  </div>
</body>
</html>
